name: Official standards validation
on:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify official versioned validation resources
        run: python3 scripts/standards-assets.py
      - name: Inspect supported original schema particles
        run: python3 scripts/gaeb-schema-inventory.py
      - name: Verify the pinned validator command line
        run: java -jar .standards/validator.jar --help
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: official-validation-resource-inventory
          path: .standards/inventory.json
          include-hidden-files: true
  manufacturer-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install local PDF text reader
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Verify manufacturer originals and extract dimension facts without republishing manuals
        run: python3 scripts/manufacturer-reference-inventory.py

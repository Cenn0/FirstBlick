name: Operations
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create isolated local credentials and validate Compose
        run: |
          python3 -m unittest discover -s scripts -p 'test_roof_actions_smoke.py' -v
          python3 -m unittest discover -s scripts -p 'test_smoke_tenant.py' -v
          ./scripts/init-local.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.env')
          text = p.read_text().replace('API_PORT=8080', 'API_PORT=18080').replace('POSTGRES_PORT=5432', 'POSTGRES_PORT=15432').replace('S3_PORT=8333', 'S3_PORT=18333')
          p.write_text(text)
          PY
          docker compose version
          docker compose config --quiet
      - name: Build pinned images, migrate, bootstrap and start the actual stack
        run: ./scripts/start-local.sh
      - name: Verify the actual API, Identity cookies and tenant CRUD
        run: python3 scripts/container-smoke.py
      - name: Real PostgreSQL 18.6 and versioned S3 backup/restore drill
        run: |
          FIRSTBLICK_OPS_CONTAINER=true ./scripts/restore-drill.sh --output /backups/ci-drill
          cp backups/ci-drill/drill-report.json artifacts/operations/restore-drill.json
          cp backups/ci-drill/restore-report.json artifacts/operations/restore-report.json
      - name: Canonical legacy migration, exact comparison and blocked-source cases
        run: |
          FIRSTBLICK_OPS_CONTAINER=true ./scripts/operations.sh migration-drill --output /backups/ci-migration
          cp backups/ci-migration/migration-drill.json artifacts/operations/migration-drill.json
      - name: Verify platform-created second business and bidirectional tenant isolation
        run: python3 scripts/business_creation_smoke.py
      - name: Verify the running application backup and restart without data loss
        run: |
          FIRSTBLICK_OPS_CONTAINER=true ./scripts/backup.sh --output /backups/ci-application
          FIRSTBLICK_OPS_CONTAINER=true ./scripts/operations.sh verify --input /backups/ci-application > /dev/null
          docker compose restart api worker
          python3 scripts/container-smoke.py
      - name: Capture component identities and bounded logs
        if: always()
        run: |
          mkdir -p artifacts/operations
          docker compose ps --format json > artifacts/operations/containers.json
          python3 scripts/container-diagnostics.py > artifacts/operations/diagnostics.json
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          refs = subprocess.check_output(['docker', 'compose', 'images', '-q'], text=True).split()
          images = json.loads(subprocess.check_output(['docker', 'image', 'inspect', *sorted(set(refs))], text=True)) if refs else []
          safe = [{'id': image['Id'], 'tags': image.get('RepoTags', []), 'digests': image.get('RepoDigests', [])} for image in images]
          pathlib.Path('artifacts/operations/images.json').write_text(json.dumps(safe, indent=2) + '\n')
          # This directory contains only synthetic JSON reports. Never publish
          # the target PFX, application backup, source export or environment.
          reports = pathlib.Path('artifacts/operations/migration')
          reports.mkdir(exist_ok=True)
          for report in pathlib.Path('backups/ci-migration').glob('*.json'):
              shutil.copyfile(report, reports / report.name)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: operations-evidence
          path: artifacts/operations
          retention-days: 14
      - name: Remove only this ephemeral CI stack
        if: always()
        run: docker compose down -v --remove-orphans

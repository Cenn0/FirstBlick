name: CI
on:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: firstblick_test
          POSTGRES_PASSWORD: ci-isolated-test-password
          POSTGRES_DB: firstblick_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U firstblick_test -d firstblick_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FIRSTBLICK_TEST_POSTGRES: Host=localhost;Port=5432;Database=firstblick_test;Username=firstblick_test;Password=ci-isolated-test-password
      FIRSTBLICK_REQUIRE_POSTGRES: 'true'
      FIRSTBLICK_STANDARDS_PATH: ${{ github.workspace }}/.standards
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Prepare fonts and the local validator runtime
        timeout-minutes: 5
        run: |
          : "${JAVA_HOME_21_X64:?Java 21 is required on the Ubuntu runner}"
          test -x "${JAVA_HOME_21_X64}/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          printf '%s\n' "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          "${JAVA_HOME_21_X64}/bin/java" -version
          if [[ ! -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || ! -s /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]]; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-dejavu-core
          fi
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Install original hash-pinned XSD and Schematron resources
        run: python3 scripts/standards-assets.py
      - run: dotnet restore FirstBlick.slnx --locked-mode
      - run: dotnet test FirstBlick.slnx -c Release --no-restore --logger trx --results-directory TestResults
      - name: Independent domain acceptance references (P0)
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_domain_gate.py' -v
          dotnet test tests/FirstBlick.Core.Tests/FirstBlick.Core.Tests.csproj -c Release --no-restore --no-build --filter FullyQualifiedName~DomainAcceptanceGateTests --logger "trx;LogFileName=domain-acceptance.trx" --results-directory TestResults
          python3 scripts/verify-domain-gate.py TestResults/domain-acceptance.trx
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: server-test-results
          path: TestResults
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      # Ubuntu 24.04 hosted runners already provide the shared libraries used by
      # Chromium. Avoid apt upgrading optional packages from unreliable mirrors.
      # Fail early if a future runner image no longer supports this browser.
      - name: Install pinned Chromium and verify launch
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '45000'
        run: |
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await page.goto('data:text/html,<title>FirstBlick CI browser probe</title>');
            if (await page.title() !== 'FirstBlick CI browser probe') {
              throw new Error('Chromium smoke test did not render the expected page');
            }
            console.log('Pinned Playwright Chromium is runnable with the hosted runner libraries.');
          } finally {
            await browser.close();
          }
          NODE
      - run: npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: browser-failure-evidence
          path: web/test-results
